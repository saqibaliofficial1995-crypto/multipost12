name: Daily Upload

on:
  schedule:
    - cron: '10 1,7,13 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (validate without uploading/modifying state)'
        required: false
        type: boolean
        default: false
      max_uploads:
        description: 'Maximum videos to upload in this run'
        required: false
        default: '1'

concurrency:
  group: multipost12-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client requests

      - name: Set up FFmpeg
        uses: FedericoCarboni/setup-ffmpeg@v3
        with:
          ffmpeg-version: release

      - name: Run CI Uploader
        env:
          PYTHONIOENCODING: utf-8
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          DRY_ARG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_ARG="--dry-run"
          fi
          MAX_ARG="--max-uploads ${{ inputs.max_uploads || 1 }}"
          python -m src.ci_run $DRY_ARG $MAX_ARG

      - name: Commit and push state changes
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "saqibaliofficial1995-crypto"
          git config user.email "saqibaliofficial1995@gmail.com"
          git add state/uploaded.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update upload state [skip ci]"
            git push origin main
          fi
