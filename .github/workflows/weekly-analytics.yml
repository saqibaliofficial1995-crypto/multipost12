name: Weekly Analytics

on:
  schedule:
    - cron: '10 15 * * 0'
  workflow_dispatch:

concurrency:
  group: multipost12-${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  analytics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-api-python-client requests

      - name: Run Analytics Pull
        env:
          PYTHONIOENCODING: utf-8
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          python -m src.analytics

      - name: Commit and push reports
        run: |
          git config user.name "jacksstorna-netizen"
          git config user.email "jacksstorna@gmail.com"
          git add reports/
          if git diff --staged --quiet; then
            echo "No reports to commit."
          else
            git commit -m "Update weekly analytics report [skip ci]"
            git push origin main
          fi
